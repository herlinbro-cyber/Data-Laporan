<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Absensi & Data Siswa</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-800 font-sans pb-20">

    <header class="bg-indigo-600 text-white p-4 shadow-md sticky top-0 z-50">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <h1 class="font-bold text-lg"><i class="fa-solid fa-user-check mr-2"></i>Absensi & Siswa</h1>
            <span id="currentDate" class="text-xs bg-indigo-700 px-2 py-1 rounded"></span>
        </div>
    </header>

    <main class="max-w-md mx-auto p-4 space-y-4">
        <!-- NAVIGASI -->
        <div class="grid grid-cols-3 gap-1 bg-white rounded-xl shadow-sm p-1 border border-slate-200 text-xs font-semibold text-center">
            <a href="index.html" class="py-2 rounded-lg bg-indigo-600 text-white shadow-sm"><i class="fa-solid fa-clipboard-user block mb-1"></i>Absensi</a>
            <a href="jurnal.html" class="py-2 rounded-lg text-slate-600 hover:bg-slate-100"><i class="fa-solid fa-book-open block mb-1"></i>Jurnal</a>
            <a href="bk.html" class="py-2 rounded-lg text-slate-600 hover:bg-slate-100"><i class="fa-solid fa-handshake-angle block mb-1"></i>Laporan BK</a>
        </div>

        <div class="flex bg-slate-200 rounded-lg p-1 text-xs font-semibold text-center">
            <button onclick="switchSub('absen')" id="btn-sub-absen" class="flex-1 py-1.5 rounded-md bg-white text-indigo-600 shadow-sm transition">Form Absensi Kelas</button>
            <button onclick="switchSub('siswa')" id="btn-sub-siswa" class="flex-1 py-1.5 rounded-md text-slate-600 transition">Data Siswa</button>
        </div>

        <!-- FORM ABSENSI -->
        <div id="sub-absen" class="space-y-4">
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 space-y-3">
                <h2 class="font-bold text-base text-indigo-600">Pencatatan Absensi Kelas</h2>
                <div>
                    <label class="block font-medium text-slate-600 mb-1 text-xs">Tanggal</label>
                    <input type="date" id="absTanggal" class="w-full p-2 border rounded-lg outline-none text-xs">
                </div>
                <div>
                    <label class="block font-medium text-slate-600 mb-1 text-xs">Pilih Kelas</label>
                    <select id="absKelas" onchange="loadDaftarAbsensiKelas()" class="w-full p-2 border rounded-lg outline-none text-xs font-semibold bg-slate-50">
                        <option value="">Pilih Kelas Terlebih Dahulu</option>
                    </select>
                </div>

                <div id="wrapperDaftarAbsen" class="hidden space-y-2">
                    <div class="flex justify-between items-center text-xs font-bold text-slate-700 border-b pb-1">
                        <span>Nama Siswa</span>
                        <span>Status Kehadiran</span>
                    </div>
                    <div id="containerSiswaAbsen" class="max-h-72 overflow-y-auto space-y-2 pr-1"></div>
                    <button onclick="simpanAbsensiKelas(event)" id="btnSimpanAbsen" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium p-2.5 rounded-lg transition text-xs mt-2 shadow-sm"><i class="fa-solid fa-floppy-disk mr-1"></i>Simpan Absensi & Kirim ke Sheets</button>
                </div>
            </div>

            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                <div class="flex justify-between items-center mb-3">
                    <h3 class="font-bold text-sm text-slate-700">Riwayat Absensi Lokal</h3>
                    <button onclick="clearData('absensi')" class="text-xs text-red-500 hover:underline">Hapus Lokal</button>
                </div>
                <div id="listAbsensi" class="space-y-2 text-xs max-h-60 overflow-y-auto"></div>
            </div>
        </div>

        <!-- DATA SISWA -->
        <div id="sub-siswa" class="space-y-4 hidden">
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                <h2 class="font-bold text-base mb-3 text-indigo-600">Upload Data Siswa (Excel/CSV)</h2>
                <input type="file" id="excelFile" accept=".xlsx, .xls, .csv" class="w-full p-1 border rounded-lg text-xs mb-3">
                <button onclick="handleExcelUpload()" class="w-full bg-emerald-600 text-white font-medium p-2 rounded-lg transition text-sm">Proses & Simpan Data</button>
            </div>

            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                <h3 class="font-bold text-sm mb-3 text-slate-700">Input Manual Siswa</h3>
                <form id="formSiswaManual" onsubmit="saveSiswaManual(event)" class="space-y-3 text-sm">
                    <div>
                        <label class="block font-medium text-slate-600 mb-1 text-xs">Kelas</label>
                        <input type="text" id="manualKelas" placeholder="Contoh: X-1" required class="w-full p-2 border rounded-lg outline-none text-xs">
                    </div>
                    <div>
                        <label class="block font-medium text-slate-600 mb-1 text-xs">Nama Lengkap Siswa</label>
                        <input type="text" id="manualNama" placeholder="Nama Siswa" required class="w-full p-2 border rounded-lg outline-none text-xs">
                    </div>
                    <button type="submit" class="w-full bg-slate-700 text-white font-medium p-2 rounded-lg transition text-xs">Tambah Siswa</button>
                </form>
            </div>

            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                <div class="flex justify-between items-center mb-3">
                    <h3 class="font-bold text-sm text-slate-700">Daftar Siswa (<span id="totalSiswa">0</span>)</h3>
                    <button onclick="clearData('siswa')" class="text-xs text-red-500 hover:underline">Hapus Semua</button>
                </div>
                <div id="listSiswa" class="space-y-1 text-xs max-h-60 overflow-y-auto"></div>
            </div>
        </div>
    </main>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx2bqXVWWhzfhQ44zj8zCOnOKX1D9Css9IwfIVKpI9xGFDbUVBMsxg-fT172jKfK_31vA/exec"; // <-- GANTI DENGAN URL WEB APP ANDA (/exec)

        document.getElementById('absTanggal').valueAsDate = new Date();
        document.getElementById('currentDate').innerText = new Date().toLocaleDateString('id-ID', {weekday: 'long', day: 'numeric', month: 'short'});

        function switchSub(target) {
            if(target === 'absen') {
                document.getElementById('sub-absen').classList.remove('hidden');
                document.getElementById('sub-siswa').classList.add('hidden');
                document.getElementById('btn-sub-absen').className = "flex-1 py-1.5 rounded-md bg-white text-indigo-600 shadow-sm transition";
                document.getElementById('btn-sub-siswa').className = "flex-1 py-1.5 rounded-md text-slate-600 transition";
                loadKelasDropdown();
            } else {
                document.getElementById('sub-siswa').classList.remove('hidden');
                document.getElementById('sub-absen').classList.add('hidden');
                document.getElementById('btn-sub-siswa').className = "flex-1 py-1.5 rounded-md bg-white text-indigo-600 shadow-sm transition";
                document.getElementById('btn-sub-absen').className = "flex-1 py-1.5 rounded-md text-slate-600 transition";
                renderSiswa();
            }
        }

        window.onload = function() { loadKelasDropdown(); renderAbsensi(); renderSiswa(); };
        function getSiswaData() { return JSON.parse(localStorage.getItem('db_siswa')) || []; }

        function loadKelasDropdown() {
            let data = getSiswaData();
            let kelasSet = [...new Set(data.map(s => s.kelas))];
            let kelasSelect = document.getElementById('absKelas');
            let currentVal = kelasSelect.value;
            kelasSelect.innerHTML = '<option value="">Pilih Kelas Terlebih Dahulu</option>';
            kelasSet.forEach(k => { kelasSelect.innerHTML += `<option value="${k}">${k}</option>`; });
            if(currentVal) kelasSelect.value = currentVal;
        }

        function loadDaftarAbsensiKelas() {
            let kelas = document.getElementById('absKelas').value;
            let wrapper = document.getElementById('wrapperDaftarAbsen');
            let container = document.getElementById('containerSiswaAbsen');
            if(!kelas) { wrapper.classList.add('hidden'); return; }
            let dataSiswa = getSiswaData().filter(s => s.kelas === kelas);
            container.innerHTML = '';
            if(dataSiswa.length === 0) {
                container.innerHTML = '<p class="text-slate-400 italic text-center py-2">Tidak ada siswa di kelas ini.</p>';
                wrapper.classList.remove('hidden');
                return;
            }
            dataSiswa.forEach((s, idx) => {
                container.innerHTML += `
                    <div class="flex justify-between items-center bg-slate-50 p-2 rounded border border-slate-200">
                        <span class="font-medium text-slate-700 w-1/2 truncate">${idx + 1}. ${s.nama}</span>
                        <div class="flex space-x-1 text-[11px] font-semibold w-1/2 justify-end">
                            <label class="px-1.5 py-0.5 rounded bg-emerald-100 text-emerald-700 cursor-pointer"><input type="radio" name="status_${idx}" value="Hadir" checked class="mr-0.5">H</label>
                            <label class="px-1.5 py-0.5 rounded bg-amber-100 text-amber-700 cursor-pointer"><input type="radio" name="status_${idx}" value="Sakit" class="mr-0.5">S</label>
                            <label class="px-1.5 py-0.5 rounded bg-blue-100 text-blue-700 cursor-pointer"><input type="radio" name="status_${idx}" value="Izin" class="mr-0.5">I</label>
                            <label class="px-1.5 py-0.5 rounded bg-red-100 text-red-700 cursor-pointer"><input type="radio" name="status_${idx}" value="Alpa" class="mr-0.5">A</label>
                        </div>
                        <input type="hidden" class="nama-siswa-input" value="${s.nama}">
                    </div>`;
            });
            wrapper.classList.remove('hidden');
        }

        async function simpanAbsensiKelas(e) {
            e.preventDefault();
            let tanggal = document.getElementById('absTanggal').value;
            let kelas = document.getElementById('absKelas').value;
            let rows = document.querySelectorAll('#containerSiswaAbsen .flex');
            if(rows.length === 0) return;

            let btn = document.getElementById('btnSimpanAbsen');
            let totalSiswa = rows.length;
            btn.disabled = true;

            let listAbsen = JSON.parse(localStorage.getItem('db_absensi')) || [];

            // Kirim beruntun dengan jeda agar server Google tidak kewalahan
            for (let idx = 0; idx < totalSiswa; idx++) {
                let row = rows[idx];
                let namaSiswa = row.querySelector('.nama-siswa-input').value;
                let statusEl = row.querySelector(`input[name="status_${idx}"]:checked`);
                let statusSelected = statusEl ? statusEl.value : 'Hadir';

                btn.innerText = `Mengirim data (${idx + 1} dari ${totalSiswa})...`;

                let payload = {
                    tipe: "Absensi",
                    tanggal: tanggal,
                    kelas: kelas,
                    siswa: namaSiswa,
                    status_atau_layanan: statusSelected,
                    topik_atau_materi: "-",
                    keterangan_atau_hasil: "-",
                    foto: "Tidak Ada"
                };

                listAbsen.unshift(payload);

                let formData = new URLSearchParams();
                for (let key in payload) {
                    formData.append(key, payload[key]);
                }

                try {
                    await fetch(SCRIPT_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        body: formData
                    });
                } catch (err) {
                    console.error("Gagal kirim siswa:", namaSiswa, err);
                }

                // Beri jeda 400 milidetik antar siswa agar Google Sheets sukses mencatat baris per baris
                await new Promise(resolve => setTimeout(resolve, 400));
            }

            localStorage.setItem('db_absensi', JSON.stringify(listAbsen));
            renderAbsensi();
            
            btn.innerHTML = '<i class="fa-solid fa-floppy-disk mr-1"></i>Simpan Absensi & Kirim ke Sheets';
            btn.disabled = false;
            alert('Semua data absensi kelas berhasil dikirim ke Google Sheets!');
        }

        function handleExcelUpload() {
            let fileInput = document.getElementById('excelFile');
            if (fileInput.files.length === 0) { alert('Pilih file dulu!'); return; }
            let reader = new FileReader();
            reader.onload = function(e) {
                let data = new Uint8Array(e.target.result);
                let workbook = XLSX.read(data, {type: 'array'});
                let rows = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]], {header: 1});
                let siswaList = getSiswaData();
                for (let i = 1; i < rows.length; i++) {
                    if (rows[i][0] && rows[i][1]) {
                        siswaList.push({ kelas: String(rows[i][0]).trim(), nama: String(rows[i][1]).trim() });
                    }
                }
                localStorage.setItem('db_siswa', JSON.stringify(siswaList));
                loadKelasDropdown();
                renderSiswa();
                fileInput.value = '';
                alert('Data siswa berhasil diimpor!');
            };
            reader.readAsArrayBuffer(fileInput.files[0]);
        }

        function saveSiswaManual(e) {
            e.preventDefault();
            let kelas = document.getElementById('manualKelas').value.trim();
            let nama = document.getElementById('manualNama').value.trim();
            let data = getSiswaData();
            data.push({ kelas, nama });
            localStorage.setItem('db_siswa', JSON.stringify(data));
            document.getElementById('formSiswaManual').reset();
            loadKelasDropdown();
            renderSiswa();
            alert('Siswa berhasil ditambahkan!');
        }

        function renderSiswa() {
            let data = getSiswaData();
            let container = document.getElementById('listSiswa');
            document.getElementById('totalSiswa').innerText = data.length;
            container.innerHTML = data.length === 0 ? '<p class="text-slate-400 italic">Belum ada data siswa.</p>' : '';
            data.forEach((s, idx) => {
                container.innerHTML += `<div class="flex justify-between items-center bg-slate-50 p-2 rounded border"><span><b>[${s.kelas}]</b> ${s.nama}</span><button onclick="hapusItem('siswa', ${idx})" class="text-red-500"><i class="fa-solid fa-trash"></i></button></div>`;
            });
        }

        function renderAbsensi() {
            let list = JSON.parse(localStorage.getItem('db_absensi')) || [];
            let container = document.getElementById('listAbsensi');
            container.innerHTML = list.length === 0 ? '<p class="text-slate-400 italic">Belum ada riwayat lokal.</p>' : '';
            list.slice(0, 30).forEach((x, idx) => {
                container.innerHTML += `<div class="bg-slate-50 p-2 rounded border flex justify-between items-center"><div><b>${x.siswa}</b> (${x.kelas})<br><span class="text-[10px] text-slate-500">${x.tanggal}</span></div><span class="px-2 py-0.5 rounded font-medium bg-emerald-100 text-emerald-700">${x.status_atau_layanan}</span></div>`;
            });
        }

        function hapusItem(type, index) {
            if (confirm('Hapus item ini?')) {
                let data = JSON.parse(localStorage.getItem('db_' + type)) || [];
                data.splice(index, 1);
                localStorage.setItem('db_' + type, JSON.stringify(data));
                if (type === 'absensi') renderAbsensi();
                if (type === 'siswa') { renderSiswa(); loadKelasDropdown(); }
            }
        }

        function clearData(type) {
            if (confirm('Hapus semua?')) {
                localStorage.removeItem('db_' + type);
                if (type === 'absensi') renderAbsensi();
                if (type === 'siswa') { renderSiswa(); loadKelasDropdown(); }
            }
        }
    </script>
</body>
</html>
