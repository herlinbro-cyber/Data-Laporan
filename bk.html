<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laporan Bimbingan Konseling (BK)</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-50 min-h-screen p-4 md:p-8">
    <div class="max-w-2xl mx-auto bg-white rounded-xl shadow-md p-6">
        <h1 class="text-2xl font-bold text-slate-800 mb-6">Form Laporan Bimbingan Konseling (BK)</h1>
        
        <form id="bkForm" onsubmit="simpanBK(event)" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Tanggal</label>
                <input type="date" id="tanggal" required class="w-full p-2 border border-slate-300 rounded-lg">
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Nama Siswa (Pilih / Cari dari semua kelas)</label>
                <!-- Menggunakan datalist agar bisa memilih atau mengetik nama siswa bebas lintas kelas -->
                <input list="daftarSiswa" id="siswa" required placeholder="Ketik atau pilih nama siswa..." class="w-full p-2 border border-slate-300 rounded-lg">
                <datalist id="daftarSiswa">
                    <!-- Data siswa akan dimuat otomatis dari localStorage -->
                </datalist>
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Jenis Layanan / Kasus</label>
                <select id="statusLayanan" required class="w-full p-2 border border-slate-300 rounded-lg">
                    <option value="">-- Pilih Layanan --</option>
                    <option value="Konseling Individu">Konseling Individu</option>
                    <option value="Konseling Kelompok">Konseling Kelompok</option>
                    <option value="Bimbingan Karir">Bimbingan Karir</option>
                    <option value="Mediasi / Kasus">Mediasi / Penanganan Kasus</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Hasil / Catatan Layanan</label>
                <textarea id="keterangan" rows="4" required class="w-full p-2 border border-slate-300 rounded-lg" placeholder="Uraikan hasil bimbingan atau catatan konseling..."></textarea>
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Unggah Foto (Opsional)</label>
                <input type="file" id="foto" accept="image/*" class="w-full p-2 border border-slate-300 rounded-lg text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
            </div>

            <button type="submit" id="btnSimpan" class="w-full bg-blue-600 text-white p-2 rounded-lg font-medium hover:bg-blue-700 transition">
                Simpan Laporan BK
            </button>
        </form>
        
        <div class="mt-4 text-center">
            <a href="index.html" class="text-blue-600 hover:underline text-sm">&larr; Kembali ke Menu Utama</a>
        </div>
    </div>

    <script>
        // Ganti dengan URL Web App Apps Script Anda yang berakhiran /exec
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzObgBoeK8aO-0USw-9YjcqO6sxpvj--SdrFhIFVedAdc6bauqKZZZIBvdhOOh2r_slGw/exec";

        // Muat daftar siswa dari localStorage saat halaman dibuka agar bisa lintas kelas
        window.addEventListener('DOMContentLoaded', () => {
            document.getElementById('tanggal').valueAsDate = new Date();
            muatDaftarSiswaLintasKelas();
        });

        function muatDaftarSiswaLintasKelas() {
            const datalist = document.getElementById('daftarSiswa');
            datalist.innerHTML = '';
            
            // Mengambil data siswa yang tersimpan di localStorage dari menu utama/absensi
            let savedData = localStorage.getItem('data_siswa_sekolah');
            if (savedData) {
                try {
                    let siswaList = JSON.parse(savedData);
                    siswaList.forEach(s => {
                        let option = document.createElement('option');
                        // Menampilkan nama beserta kelasnya di pilihan agar mudah dikenali
                        option.value = `${s.nama} (${s.kelas})`;
                        datalist.appendChild(option);
                    });
                } catch(e) {
                    console.error("Gagal memuat data siswa:", e);
                }
            }
        }

        async function simpanBK(e) {
            e.preventDefault();
            const btn = document.getElementById('btnSimpan');
            btn.disabled = true;
            btn.innerText = "Mengirim...";

            const fileInput = document.getElementById('foto');
            let fotoBase64 = "";

            if (fileInput.files.length > 0) {
                fotoBase64 = await toBase64(fileInput.files[0]);
            }

            const payload = {
                tipe: "BK",
                tanggal: document.getElementById('tanggal').value,
                kelas: "Lintas Kelas / BK",
                siswa: document.getElementById('siswa').value,
                statusLayanan: document.getElementById('statusLayanan').value,
                topikMateri: "Layanan Bimbingan Konseling",
                keterangan: document.getElementById('keterangan').value,
                foto: fotoBase64
            };

            try {
                let formData = new URLSearchParams();
                for (let key in payload) {
                    formData.append(key, payload[key]);
                }

                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    body: formData
                });

                alert('Laporan BK berhasil dikirim ke Google Sheets!');
                document.getElementById('bkForm').reset();
                document.getElementById('tanggal').valueAsDate = new Date();
            } catch (err) {
                console.error(err);
                alert('Gagal mengirim data. Periksa koneksi internet.');
            } finally {
                btn.disabled = false;
                btn.innerText = "Simpan Laporan BK";
            }
        }

        function toBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
            });
        }
    </script>
</body>
</html>
