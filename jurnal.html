<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jurnal Mengajar</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-800 font-sans pb-20">

    <header class="bg-indigo-600 text-white p-4 shadow-md sticky top-0 z-50">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <h1 class="font-bold text-lg"><i class="fa-solid fa-book-open mr-2"></i>Jurnal Pembelajaran</h1>
        </div>
    </header>

    <main class="max-w-md mx-auto p-4 space-y-4">
        <div class="grid grid-cols-3 gap-1 bg-white rounded-xl shadow-sm p-1 border border-slate-200 text-xs font-semibold text-center">
            <a href="index.html" class="py-2 rounded-lg text-slate-600 hover:bg-slate-100"><i class="fa-solid fa-clipboard-user block mb-1"></i>Absensi</a>
            <a href="jurnal.html" class="py-2 rounded-lg bg-indigo-600 text-white shadow-sm"><i class="fa-solid fa-book-open block mb-1"></i>Jurnal</a>
            <a href="bk.html" class="py-2 rounded-lg text-slate-600 hover:bg-slate-100"><i class="fa-solid fa-handshake-angle block mb-1"></i>Laporan BK</a>
        </div>

        <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
            <h2 class="font-bold text-base mb-3 text-indigo-600">Input Jurnal Mengajar</h2>
            <form id="formJurnal" onsubmit="saveJurnal(event)" class="space-y-3 text-sm">
                <div>
                    <label class="block font-medium text-slate-600 mb-1">Hari / Tanggal</label>
                    <input type="date" id="jurTanggal" required class="w-full p-2 border rounded-lg outline-none">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block font-medium text-slate-600 mb-1">Jam Ke-</label>
                        <input type="text" id="jurJam" placeholder="1 - 3" required class="w-full p-2 border rounded-lg outline-none">
                    </div>
                    <div>
                        <label class="block font-medium text-slate-600 mb-1">Kelas</label>
                        <input type="text" id="jurKelas" placeholder="X-1" required class="w-full p-2 border rounded-lg outline-none">
                    </div>
                </div>
                <div>
                    <label class="block font-medium text-slate-600 mb-1">Materi Pembelajaran</label>
                    <input type="text" id="jurMateri" placeholder="Analisis Data" required class="w-full p-2 border rounded-lg outline-none">
                </div>
                <div>
                    <label class="block font-medium text-slate-600 mb-1">Catatan / Kendala</label>
                    <textarea id="jurCatatan" rows="2" placeholder="Catatan siswa..." class="w-full p-2 border rounded-lg outline-none"></textarea>
                </div>
                <div>
                    <label class="block font-medium text-slate-600 mb-1">Dokumentasi Foto</label>
                    <input type="file" id="jurFoto" accept="image/*" class="w-full p-1 border rounded-lg text-xs">
                </div>
                <button type="submit" id="btnSimpanJurnal" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium p-2 rounded-lg transition">Simpan Jurnal & Kirim ke Sheets</button>
            </form>
        </div>

        <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
            <div class="flex justify-between items-center mb-3">
                <h3 class="font-bold text-sm text-slate-700">Riwayat Jurnal Lokal</h3>
                <button onclick="clearData()" class="text-xs text-red-500 hover:underline">Hapus Lokal</button>
            </div>
            <div id="listJurnal" class="space-y-3 text-xs max-h-72 overflow-y-auto"></div>
        </div>
    </main>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxsSnL50h-lLwQHA6IeIRrtrh_OXhQLb0QqfP4aPDLG7znxO8s8kZh_oedzAVUzXaABbw/exec"; // <-- GANTI DENGAN URL WEB APP ANDA

        document.getElementById('jurTanggal').valueAsDate = new Date();
        window.onload = function() { renderJurnal(); };

        async function saveJurnal(e) {
            e.preventDefault();
            let btn = document.getElementById('btnSimpanJurnal');
            btn.innerText = "Mengirim...";
            btn.disabled = true;

            let fileInput = document.getElementById('jurFoto');
            let reader = new FileReader();
            
            let processSave = async (img) => {
                let payload = {
                    tipe: "Jurnal Mengajar",
                    tanggal: document.getElementById('jurTanggal').value,
                    kelas: document.getElementById('jurKelas').value,
                    siswa: "Jam Ke-" + document.getElementById('jurJam').value,
                    status_atau_layanan: "-",
                    topik_atau_materi: document.getElementById('jurMateri').value,
                    keterangan_atau_hasil: document.getElementById('jurCatatan').value || '-',
                    foto: img ? "Ada Dokumentasi" : "Tidak Ada"
                };

                let list = JSON.parse(localStorage.getItem('db_jurnal')) || [];
                list.unshift(payload);
                localStorage.setItem('db_jurnal', JSON.stringify(list));

                try {
                    await fetch(SCRIPT_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                } catch (err) { console.error(err); }

                document.getElementById('formJurnal').reset();
                document.getElementById('jurTanggal').valueAsDate = new Date();
                renderJurnal();
                btn.innerText = "Simpan Jurnal & Kirim ke Sheets";
                btn.disabled = false;
                alert('Jurnal berhasil disimpan & dikirim ke Google Sheets!');
            };

            if(fileInput.files.length > 0) {
                reader.onload = (e) => processSave(e.target.result);
                reader.readAsDataURL(fileInput.files[0]);
            } else { processSave(null); }
        }

        function renderJurnal() {
            let list = JSON.parse(localStorage.getItem('db_jurnal')) || [];
            let container = document.getElementById('listJurnal');
            container.innerHTML = list.length === 0 ? '<p class="text-slate-400 italic">Belum ada jurnal.</p>' : '';
            list.forEach((x, idx) => {
                container.innerHTML += `<div class="bg-slate-50 p-3 rounded border space-y-1"><div class="flex justify-between font-bold text-slate-800"><span>${x.kelas} (${x.siswa})</span><span class="text-slate-500 font-normal">${x.tanggal}</span></div><div><b>Materi:</b> ${x.topik_atau_materi}</div><div class="text-slate-600"><b>Catatan:</b> ${x.keterangan_atau_hasil}</div></div>`;
            });
        }

        function clearData() {
            if (confirm('Hapus riwayat lokal?')) {
                localStorage.removeItem('db_jurnal');
                renderJurnal();
            }
        }
    </script>
</body>
</html>
