<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jurnal Mengajar Guru</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-50 min-h-screen p-4 md:p-8">
    <div class="max-w-2xl mx-auto bg-white rounded-xl shadow-md p-6">
        <h1 class="text-2xl font-bold text-slate-800 mb-6">Form Jurnal Mengajar</h1>
        
        <form id="jurnalForm" onsubmit="simpanJurnal(event)" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Tanggal</label>
                <input type="date" id="tanggal" required class="w-full p-2 border border-slate-300 rounded-lg">
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Kelas</label>
                <select id="kelas" required class="w-full p-2 border border-slate-300 rounded-lg">
                    <option value="">-- Pilih Kelas --</option>
                    <option value="Kelas X">Kelas X</option>
                    <option value="Kelas XI">Kelas XI</option>
                    <option value="Kelas XII">Kelas XII</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Mata Pelajaran</label>
                <input type="text" id="mapel" required placeholder="Contoh: Informatika / Bimbingan Konseling" class="w-full p-2 border border-slate-300 rounded-lg">
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Topik / Materi Pembelajaran</label>
                <input type="text" id="topikMateri" required placeholder="Contoh: Analisis Data / Layanan Klasikal" class="w-full p-2 border border-slate-300 rounded-lg">
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Keterangan / Catatan Kegiatan</label>
                <textarea id="keterangan" rows="4" required class="w-full p-2 border border-slate-300 rounded-lg" placeholder="Uraikan kegiatan pembelajaran atau catatan penting..."></textarea>
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Unggah Foto Kegiatan (Opsional)</label>
                <input type="file" id="foto" accept="image/*" class="w-full p-2 border border-slate-300 rounded-lg text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
            </div>

            <button type="submit" id="btnSimpan" class="w-full bg-blue-600 text-white p-2 rounded-lg font-medium hover:bg-blue-700 transition">
                Simpan Jurnal & Kirim ke Sheets
            </button>
        </form>
        
        <div class="mt-4 text-center">
            <a href="index.html" class="text-blue-600 hover:underline text-sm">&larr; Kembali ke Menu Utama</a>
        </div>
    </div>

    <script>
        // Ganti dengan URL Web App Apps Script Anda yang berakhiran /exec
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzObgBoeK8aO-0USw-9YjcqO6sxpvj--SdrFhIFVedAdc6bauqKZZZIBvdhOOh2r_slGw/exec";

        window.addEventListener('DOMContentLoaded', () => {
            document.getElementById('tanggal').valueAsDate = new Date();
        });

        async function simpanJurnal(e) {
            e.preventDefault();
            const btn = document.getElementById('btnSimpan');
            btn.disabled = true;
            btn.innerText = "Mengirim...";

            const fileInput = document.getElementById('foto');
            let fotoBase64 = "";

            if (fileInput.files.length > 0) {
                fotoBase64 = await toBase64(fileInput.files[0]);
            }

            const payload = {
                tipe: "Jurnal Mengajar",
                tanggal: document.getElementById('tanggal').value,
                kelas: document.getElementById('kelas').value,
                siswa: "-", // Jurnal bersifat umum per kelas
                statusLayanan: document.getElementById('mapel').value,
                topikMateri: document.getElementById('topikMateri').value,
                keterangan: document.getElementById('keterangan').value,
                foto: fotoBase64
            };

            try {
                let formData = new URLSearchParams();
                for (let key in payload) {
                    formData.append(key, payload[key]);
                }

                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    body: formData
                });

                alert('Jurnal berhasil dikirim ke Google Sheets!');
                document.getElementById('jurnalForm').reset();
                document.getElementById('tanggal').valueAsDate = new Date();
            } catch (err) {
                console.error(err);
                alert('Gagal mengirim data. Periksa koneksi internet.');
            } finally {
                btn.disabled = false;
                btn.innerText = "Simpan Jurnal & Kirim ke Sheets";
            }
        }

        function toBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
            });
        }
    </script>
</body>
</html>
